
services:
  db:
    image: postgres:15-alpine
    container_name: shawttyy-db
    restart: always
    environment:
      POSTGRES_USER: shawttyy_admin
      POSTGRES_PASSWORD: shawttyy_ka_password
      POSTGRES_DB: shawttyy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: